[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reworkbench"
version = "0.1.0"
description = "Bancada desktop de engenharia reversa com Ghidra"
requires-python = ">=3.13"
dependencies = ["PySide6-Essentials>=6.9,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-qt>=4.4,<5"]
engine = ["pyghidra==3.1.0"]

[project.gui-scripts]
reworkbench = "reworkbench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
